    hint: Jeremy Lefebvre. Titles are hype-heavy; report the actual thesis and numbers, ignore the hype.
  - name: Financial Education 2
    color: "#00D68F"
    group: Jeremy Lefebvre
    url: https://www.youtube.com/@FinancialEducation2
    hint: Jeremy Lefebvre. Titles are hype-heavy; report the actual thesis and numbers, ignore the hype.
