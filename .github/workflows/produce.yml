name: 2 - Produzione (giornaliera e settimanale)

on:
  schedule:
    - cron: "43 10 * * *"   # ogni giorno alle 17:43 ora di Bangkok (10:43 UTC)
    - cron: "13 12 * * 0"   # ogni domenica alle 19:13 ora di Bangkok -> recap settimanale
  workflow_dispatch:
    inputs:
      kind:
        description: "daily o weekly"
        default: daily

permissions:
  contents: read

concurrency:
  group: produce
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install -r requirements.txt
      - name: Scegli il tipo
        id: k
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "kind=${{ inputs.kind }}" >> $GITHUB_OUTPUT;
          elif [ "${{ github.event.schedule }}" = "13 12 * * 0" ]; then echo "kind=weekly" >> $GITHUB_OUTPUT;
          else echo "kind=daily" >> $GITHUB_OUTPUT; fi
      - name: Scrivi copioni e monta video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python pipeline/produce.py ${{ steps.k.outputs.kind }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ steps.k.outputs.kind }}-${{ github.run_id }}
          path: |
            output/**/*.mp4
            output/**/*.png
            output/**/*.txt
            output/**/script.json
            !output/**/_tmp/**
          retention-days: 14
      - name: Avvisa su Telegram in caso di errore
        if: failure()
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s "https://api.telegram.org/bot$TOKEN/sendMessage" -d chat_id="$CHAT" \
            -d text="❌ ${{ github.workflow }} fallito: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
