name: 2 - Produzione (giornaliera e settimanale)

# Orari in UTC (Bangkok = UTC+7). Le righe "ripresa" completano solo quello che manca:
# se e' gia' tutto consegnato finiscono in pochi secondi.
on:
  schedule:
    - cron: "43 10 * * *"   # giornaliero, 17:43 Bangkok
    - cron: "43 13 * * *"   # ripresa giornaliero, 20:43
    - cron: "13 16 * * *"   # seconda ripresa, 23:13
    - cron: "13 12 * * 0"   # settimanale, domenica 19:13
    - cron: "13 15 * * 0"   # ripresa settimanale, domenica 22:13
  workflow_dispatch:
    inputs:
      kind:
        description: "Cosa produrre"
        type: choice
        options: [daily, weekly]
        default: daily
      force:
        description: "Rifai anche se gia' consegnato"
        type: boolean
        default: false
      silent:
        description: "Prova senza inviare su Telegram (i file restano negli Artifacts)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: produce
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - run: pip install -q -r requirements.txt
      - name: Scegli cosa produrre
        id: k
        run: |
          KIND=daily; FORCE=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            KIND="${{ inputs.kind }}"
            if [ "${{ inputs.force }}" = "true" ]; then FORCE="--force"; fi
          elif [ "${{ github.event.schedule }}" = "13 12 * * 0" ] || [ "${{ github.event.schedule }}" = "13 15 * * 0" ]; then
            KIND=weekly
          fi
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"
          echo "force=$FORCE" >> "$GITHUB_OUTPUT"
      - name: Copioni, voce, video, short e caroselli
        id: run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MP_SILENT: ${{ inputs.silent && '1' || '' }}
        run: python -m mp.produce ${{ steps.k.outputs.kind }} ${{ steps.k.outputs.force }}
      - name: Salva copioni e stato
        if: always()
        run: |
          scripts/save.sh "dati: produzione ${{ steps.k.outputs.kind }} $(date -u +%F_%H%M)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ steps.k.outputs.kind }}-${{ github.run_id }}
          path: |
            output/**
            !output/**/_tmp*/**
          retention-days: 14
          if-no-files-found: ignore
      - name: Avviso se la macchina non e' partita
        if: failure() && steps.run.conclusion != 'failure'
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s "https://api.telegram.org/bot$TOKEN/sendMessage" -d chat_id="$CHAT" \
            -d text="❌ Produzione: errore tecnico di GitHub. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > /dev/null
