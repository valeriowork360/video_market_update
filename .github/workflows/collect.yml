name: 1 - Raccolta (ogni 4 ore)

on:
  schedule:
    - cron: "17 */4 * * *"   # ogni 4 ore (UTC)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-writer
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Analizza nuovi video e notizie
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python pipeline/collect.py
      - name: Salva i dati nel repository
        run: |
          git config user.name "market-bot"
          git config user.email "market-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: raccolta $(date -u +%F_%H%M)"
          git pull --rebase && git push
